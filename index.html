<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP 01 - Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <!-- Zone de notification d'erreur -->
    <div id="error-message" class="alert alert-error hidden" role="alert"></div>

    <!-- Formulaire d'inscription -->
    <form id="signup-form" novalidate>
      <h1>Inscription</h1>

      <div class="form-group">
        <label for="login">Login</label>
        <input type="text" id="login" name="login" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmation du mot de passe</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
      </div>

      <div class="form-group">
        <label for="lastname">Nom</label>
        <input type="text" id="lastname" name="lastname" required>
      </div>

      <div class="form-group">
        <label for="firstname">Prénom</label>
        <input type="text" id="firstname" name="firstname" required>
      </div>

      <div class="form-group">
        <label for="address">Adresse</label>
        <input type="text" id="address" name="address" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="phone">Téléphone</label>
        <input type="tel" id="phone" name="phone" required>
      </div>

      <div class="form-group">
        <label for="birthdate">Date de naissance</label>
        <input type="date" id="birthdate" name="birthdate" required>
      </div>

      <button type="submit" id="submit-button">S'inscrire</button>
    </form>

    <!-- Page récapitulative (masquée par défaut) -->
    <section id="recap-container" class="hidden">
      <h2>Récapitulatif de l'inscription</h2>
      <div id="recap-content" class="recap-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
