<div class="cyber-container">
  <div class="glass-panel">

    <!-- ÉTAPE 1 : FORMULAIRE D'INSCRIPTION (affiché par défaut) -->
    <ng-container *ngIf="!currentUser">
      <header>
        <h1 class="clean-title">PORTAIL D'ACCÈS</h1>
        <p class="subtitle">Veuillez vous inscrire pour accéder au module de suivi de pollution</p>
      </header>

      <main>
        <app-client-signup (signupSuccess)="onSignupSuccess($event)"></app-client-signup>
      </main>
    </ng-container>

    <!-- ÉTAPE 2 : PLATEFORME DE SIGNALEMENT (affichée une fois inscrit) -->
    <ng-container *ngIf="currentUser">
      
      <!-- Barre d'état utilisateur connecté -->
      <div class="user-status-bar">
        <div class="user-badge">
          <span class="user-dot"></span>
          <span class="user-name">
            Agent connecté : <strong>{{ currentUser.prenom }} {{ currentUser.nom }}</strong>
            <span class="user-login">&#64;{{ currentUser.login }}</span>
          </span>
        </div>
        <button type="button" class="btn-logout" (click)="logout()" title="Se déconnecter">
          Déconnexion
        </button>
      </div>

      <header>
        <h1 class="clean-title">SUIVI DE POLLUTION</h1>
        <p class="subtitle">Module d'observation terrestre</p>
      </header>

      <main>
        <app-pollution-form *ngIf="!isSubmitted" (formSubmit)="onFormSubmit($event)"></app-pollution-form>
        <app-pollution-recap *ngIf="isSubmitted" [data]="formData"></app-pollution-recap>
      </main>
    </ng-container>

  </div>
</div>
