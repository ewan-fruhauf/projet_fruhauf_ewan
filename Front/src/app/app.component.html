<div class="app-layout">
  
  <!-- NAVIGATION GLOBALE EN HAUT -->
  <header class="main-navbar">
    <div class="nav-brand">
      <a routerLink="/pollutions" class="brand-link">
        <span class="brand-logo">🛡️</span>
        <div class="brand-text">
          <span class="brand-title">TERRA SHIELD</span>
          <span class="brand-sub">SURVEILLANCE & POLLUTION</span>
        </div>
      </a>
    </div>

    <!-- Liens de navigation -->
    <nav class="nav-links">
      <a 
        routerLink="/pollutions" 
        routerLinkActive="active-link" 
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item">
        <span class="nav-icon">📋</span>
        <span>Signalements</span>
      </a>

      <a 
        routerLink="/pollutions/new" 
        routerLinkActive="active-link" 
        class="nav-item">
        <span class="nav-icon">＋</span>
        <span>Déclarer</span>
      </a>

      <a 
        routerLink="/signup" 
        routerLinkActive="active-link" 
        class="nav-item">
        <span class="nav-icon">👤</span>
        <span>Service Client</span>
      </a>
    </nav>

    <!-- Badge utilisateur connecté & Indicateur API -->
    <div class="nav-user-section">
      <div class="api-status-badge" [title]="'API configurée : ' + apiUrl">
        <span class="pulse-dot"></span>
        <span class="api-env-label">API Mockée (HTTP)</span>
      </div>

      @if (currentUser) {
        <div class="user-pill">
          <span class="user-avatar">🟢</span>
          <span class="user-text">
            {{ currentUser.prenom }} {{ currentUser.nom }}
          </span>
          <button type="button" class="btn-logout-mini" (click)="logout()" title="Déconnexion">
            ✕
          </button>
        </div>
      }
    </div>
  </header>

  <!-- CONTENU PRINCIPAL (ROUTÉ) -->
  <main class="app-content-wrapper">
    <div class="cyber-container app-inner-container">
      <div class="glass-panel main-panel">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>

  <!-- PIED DE PAGE -->
  <footer class="app-footer">
    <div class="footer-content">
      <span>TP 03 — Service de Gestion des Pollutions & Architecture Angular</span>
      <span class="footer-sep">•</span>
      <span>API Endpoint : <code>{{ apiUrl }}/pollutions</code></span>
    </div>
  </footer>

</div>
