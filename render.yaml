databases:
  - name: tp04-db-fruhauf-ewan
    databaseName: pollutions_db
    user: postgres
    plan: free

services:
  - type: web
    name: tp01-fruhauf-ewan
    runtime: static
    rootDir: tp01
    staticPublishPath: .

  - type: web
    name: tp02-fruhauf-ewan
    runtime: static
    rootDir: Front
    buildCommand: npm install && npm run build
    staticPublishPath: dist/front/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tp03-fruhauf-ewan
    runtime: static
    branch: tp03
    rootDir: Front
    buildCommand: npm install && npm run build
    staticPublishPath: dist/front/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tp04-fruhauf-ewan
    runtime: static
    branch: tp04
    rootDir: Front
    buildCommand: npm install && npm run build
    staticPublishPath: dist/front/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tp04-api-fruhauf-ewan
    runtime: node
    plan: free
    branch: tp04
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tp04-db-fruhauf-ewan
          property: connectionString
      - key: NODE_ENV
        value: production
